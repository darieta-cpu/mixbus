name: Build Mixbus Chain

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMC_COPY=FALSE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign (ad-hoc) and package
        run: |
          mkdir dist
          VST3=$(find build -name "*.vst3" -type d | head -n 1)
          AU=$(find build -name "*.component" -type d | head -n 1)
          echo "VST3: $VST3"; echo "AU: $AU"
          codesign --force --deep -s - "$VST3"
          codesign --force --deep -s - "$AU"
          lipo -archs "$(find "$VST3/Contents/MacOS" -type f | head -n 1)"
          ditto -c -k --keepParent "$VST3" dist/MixbusChain-VST3.zip
          ditto -c -k --keepParent "$AU" dist/MixbusChain-AU.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MixbusChain-macOS
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DMC_COPY=FALSE

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 non trovato nella cartella build" }
          Write-Host "VST3: $($vst3.FullName)"
          Copy-Item -Path $vst3.FullName -Destination "dist/MixbusChain.vst3" -Recurse
          Compress-Archive -Path "dist/MixbusChain.vst3" -DestinationPath dist/MixbusChain-VST3-Windows.zip

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer/MixbusChain.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha dato errore" }

      - uses: actions/upload-artifact@v4
        with:
          name: MixbusChain-Windows
          path: |
            dist/*.zip
            dist/*.exe
